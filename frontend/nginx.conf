server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API ──────────────────────────────────────────────────────
    # Precisa vir ANTES do location / — o nginx casa prefixo mais
    # específico primeiro, mas manter a ordem legível evita engano.
    #
    # A barra final em proxy_pass MUDA o comportamento:
    #   proxy_pass http://api:8080;   -> mantem /api/tokenize  ✅
    #   proxy_pass http://api:8080/;  -> vira    /tokenize     ❌ 404
    # O Gin registra as rotas no grupo /api, entao NAO pode ter barra.
    location /api {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA ──────────────────────────────────────────────────────
    # try_files: procura o arquivo, depois o diretorio, e por fim cai
    # no index.html. Sem essa ultima opcao, dar F5 em /detokenize
    # devolve 404 — porque essa rota so existe dentro do Angular,
    # nao no disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash no nome dos arquivos gerados pelo Angular = pode cachear
    # para sempre. O index.html NAO, senao o usuario fica preso numa
    # versao antiga que aponta para bundles que nao existem mais.
    location ~* \.(js|css|woff2|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}